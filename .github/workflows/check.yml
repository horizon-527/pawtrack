name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.lock.txt
      - run: python tools/check.py
      - name: Custom tracker Lua protocol and real API flow
        run: |
          pip install lupa==2.8
          python hardware/custom/evt-a1/firmware/test_protocol.py
          python hardware/custom/evt-a1/firmware/test_backend_flow.py
          python hardware/custom/evt-a1/scripts/verify.py --manifest
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.2
    steps:
      - uses: actions/checkout@v4
      - run: . /opt/esp/idf/export.sh && cd firmware/espidf && idf.py set-target esp32s3 && idf.py build
  deployment-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t pawtrack-ci .
      - name: Verify container startup and fail-closed login
        run: |
          docker run -d --name pawtrack-ci -v pawtrack-ci-data:/data -p 127.0.0.1:8788:8788 pawtrack-ci
          trap 'docker logs pawtrack-ci; docker rm -f pawtrack-ci; docker volume rm pawtrack-ci-data pawtrack-ci-backups pawtrack-ci-restore || true' EXIT
          python3 - <<'PY'
          import json, time
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          for attempt in range(30):
              try:
                  with urlopen('http://127.0.0.1:8788/health', timeout=2) as response:
                      assert json.load(response)['ok']
                  break
              except (URLError, OSError):
                  time.sleep(1)
          else:
              raise RuntimeError('container health check failed')
          request = Request('http://127.0.0.1:8788/v1/auth/wechat', data=b'{"code":"ci-test"}', headers={'Content-Type':'application/json'})
          try:
              urlopen(request)
              raise RuntimeError('unconfigured login must not succeed')
          except HTTPError as error:
              assert error.code == 503
          print('Container is healthy; unconfigured WeChat login fails closed')
          PY
          docker run --rm -v pawtrack-ci-data:/data -v pawtrack-ci-backups:/backups pawtrack-ci python tools/backup.py --directory /backups --interval 0
          docker run --rm -v pawtrack-ci-backups:/backups:ro -v pawtrack-ci-restore:/data pawtrack-ci python -c "from pathlib import Path; from tools.restore import restore; from server.storage import Store; restore(next(Path('/backups').glob('pawtrack-*.sqlite3')), '/data/restored.sqlite3'); store=Store('/data/restored.sqlite3'); print('Non-root container backup and restore passed')"
      - name: Validate Compose and Caddy configuration
        env:
          WECHAT_APP_ID: ci-placeholder
          WECHAT_APP_SECRET: ci-placeholder
          PAWTRACK_DOMAIN: example.com
        run: |
          docker compose -f deploy/compose.yaml config --quiet
          docker run --rm -e PAWTRACK_DOMAIN=example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10.0-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

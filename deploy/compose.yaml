services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      PAWTRACK_DB: /data/pawtrack.sqlite3
      WECHAT_APP_ID: ${WECHAT_APP_ID:?Set the real WeChat AppID}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:?Set the WeChat secret privately}
    volumes:
      - pawtrack-data:/data
    networks: [private]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  gateway:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    environment:
      PAWTRACK_DOMAIN: ${PAWTRACK_DOMAIN:?Set the real API domain}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [private]
    depends_on:
      api:
        condition: service_healthy
volumes:
  pawtrack-data:
  caddy-data:
  caddy-config:
networks:
  private:
